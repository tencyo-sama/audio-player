<!DOCTYPE html>
<html lang="ja" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Audio Player</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container-fluid d-flex flex-column vh-100 p-0">
        <!-- Header -->
        <header class="p-3 bg-dark border-bottom border-secondary d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <h1 class="h5 m-0 text-light"><i class="bi bi-music-note-beamed me-2"></i>Web Audio Player</h1>
                <a href="https://savefrom.net/" target="_blank" class="small text-secondary text-decoration-none hover-text-light">
                    <i class="bi bi-box-arrow-up-right me-1"></i>youtubeのダウンロードはここ
                </a>
            </div>
            <div class="d-flex gap-2">
                <input type="file" id="fileInput" class="form-control form-control-sm bg-dark text-light border-secondary" accept="audio/*,video/*">
            </div>
        </header>

        <!-- Main Content (Visualizer/Video) -->
        <main class="flex-grow-1 d-flex justify-content-center align-items-center bg-black position-relative overflow-hidden" id="visualizerContainer" style="min-height: 0;">
            <video id="videoPlayer" class="d-none w-100 h-100" style="object-fit: contain;" playsinline></video>
            <div id="audioVisualizer" class="text-center text-secondary">
                <i class="bi bi-music-note-list" style="font-size: 5rem;"></i>
                <p class="mt-3">Select a file to play</p>
            </div>
            
            <!-- Fullscreen Button (Video only) -->
            <button id="btnFullscreen" class="btn btn-sm btn-outline-light position-absolute top-0 end-0 m-3 d-none" style="z-index: 1050;">
                <i class="bi bi-arrows-fullscreen"></i>
            </button>

            <!-- Loop Info Overlay -->
            <div id="loopInfoOverlay" class="position-absolute bottom-0 start-50 translate-middle-x mb-3 bg-dark bg-opacity-75 px-3 py-1 rounded text-light d-none" style="z-index: 1040; font-size: 0.8rem;">
                <span id="loopStartDisplay">--:--</span> ~ <span id="loopEndDisplay">--:--</span>
            </div>
        </main>

        <!-- Controls -->
        <footer class="bg-dark border-top border-secondary p-2">
            <!-- Seek Bar -->
            <div class="row mb-2 g-0">
                <div class="col-12">
                    <input type="range" class="form-range form-range-sm" id="seekBar" value="0" min="0" max="100" step="0.1">
                    <div class="d-flex justify-content-between text-secondary" style="font-size: 0.7rem;">
                        <span id="currentTime">0:00</span>
                        <span id="totalTime">0:00</span>
                    </div>
                </div>
            </div>

            <!-- Main Buttons (Compact) -->
            <div class="d-flex justify-content-center gap-3 mb-2">
                <!-- Loop Button (State: Off -> All -> AB) -->
                <button class="btn btn-sm btn-outline-secondary rounded-circle" id="btnLoopToggle" title="Loop Mode">
                    <i class="bi bi-repeat" id="iconLoop"></i>
                </button>
                
                <button class="btn btn-sm btn-outline-light rounded-circle" id="btnSkipBack" title="-5s">
                    <i class="bi bi-arrow-counterclockwise"></i> 5s
                </button>
                <button class="btn btn-play rounded-circle text-white shadow bg-primary border-0" id="btnPlayPause" style="width: 50px; height: 50px;">
                    <i class="bi bi-play-fill" style="font-size: 1.8rem;"></i>
                </button>
                <button class="btn btn-sm btn-outline-light rounded-circle" id="btnStop">
                    <i class="bi bi-stop-fill"></i>
                </button>
                <button class="btn btn-sm btn-outline-light rounded-circle" id="btnSkipFwd" title="+5s">
                    5s <i class="bi bi-arrow-clockwise"></i>
                </button>
            </div>

            <!-- Parameters & Loop Settings -->
            <div class="row g-2">
                <!-- Tempo & Pitch -->
                <div class="col-6">
                    <div class="card bg-dark border-secondary h-100">
                        <div class="card-body p-1 text-center">
                            <label class="small text-secondary d-block mb-1">Tempo <span id="valTempo" class="text-light">100%</span></label>
                            <div class="btn-group btn-group-sm w-100" role="group">
                                <button class="btn btn-outline-secondary" id="btnTempoDown">-</button>
                                <button class="btn btn-outline-secondary" id="btnTempoReset">R</button>
                                <button class="btn btn-outline-secondary" id="btnTempoUp">+</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-6">
                    <div class="card bg-dark border-secondary h-100">
                        <div class="card-body p-1 text-center">
                            <label class="small text-secondary d-block mb-1">Pitch <span id="valPitch" class="text-light">0</span></label>
                            <div class="btn-group btn-group-sm w-100" role="group">
                                <button class="btn btn-outline-secondary" id="btnPitchDown">-</button>
                                <button class="btn btn-outline-secondary" id="btnPitchReset">R</button>
                                <button class="btn btn-outline-secondary" id="btnPitchUp">+</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Loop Control & Sync -->
                <div class="col-12">
                    <div class="card bg-dark border-secondary">
                        <div class="card-body p-1">
                            <!-- Loop Set Buttons -->
                            <div class="d-flex gap-1 mb-2 align-items-center">
                                <div class="btn-group flex-grow-1" role="group">
                                    <button class="btn btn-sm btn-outline-info py-0" id="btnSetA" style="font-size: 0.8rem;">Set A</button>
                                    <button class="btn btn-sm btn-outline-info py-0" id="btnSetB" style="font-size: 0.8rem;">Set B</button>
                                </div>
                                <button class="btn btn-sm btn-outline-danger py-0" id="btnClearLoop" title="Clear Loop"><i class="bi bi-x-lg"></i></button>
                            </div>
                            
                            <!-- A/V Sync (Wide Range Manual Control) -->
                            <div class="d-flex align-items-center gap-2">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="toggleSyncCorrection" checked>
                                    <label class="form-check-label small text-secondary" for="toggleSyncCorrection" style="font-size: 0.7rem;">Auto</label>
                                </div>
                                <div class="flex-grow-1">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <span class="small text-secondary" style="font-size: 0.7rem;">Sync Offset (±20s)</span>
                                        <span id="valSync" class="text-light small" style="font-size: 0.7rem;">0.00s</span>
                                    </div>
                                    <!-- Sync Controls Grid -->
                                    <div class="d-flex align-items-center gap-1">
                                        <!-- Big Step Down (-1s) -->
                                        <button class="btn btn-sm btn-outline-secondary py-0 px-1" id="btnSyncBigDown" style="font-size: 0.7rem; width: 25px;">&lt;&lt;</button>
                                        <!-- Fine Step Down (-0.05s) -->
                                        <button class="btn btn-sm btn-outline-secondary py-0 px-1" id="btnSyncFineDown" style="font-size: 0.7rem; width: 25px;">&lt;</button>
                                        
                                        <!-- Slider (-20.0 to 20.0) -->
                                        <input type="range" class="form-range form-range-sm" id="sliderSync" min="-20.0" max="20.0" step="0.05" value="0">
                                        
                                        <!-- Fine Step Up (+0.05s) -->
                                        <button class="btn btn-sm btn-outline-secondary py-0 px-1" id="btnSyncFineUp" style="font-size: 0.7rem; width: 25px;">&gt;</button>
                                        <!-- Big Step Up (+1s) -->
                                        <button class="btn btn-sm btn-outline-secondary py-0 px-1" id="btnSyncBigUp" style="font-size: 0.7rem; width: 25px;">&gt;&gt;</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/soundtouch.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
