<!DOCTYPE html>
<html lang="ja" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web Audio/Video Player</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-dark text-light">

    <!-- Navbar / Header -->
    <nav class="navbar navbar-dark bg-black border-bottom border-secondary fixed-top">
        <div class="container-fluid d-flex flex-wrap align-items-center gap-2">
            <span class="navbar-brand mb-0 h1 text-truncate" style="font-size: 1.1rem;">
                <i class="bi bi-music-note-beamed text-primary me-2"></i>ギターの練習するやつ
            </span>
            <div class="d-flex align-items-center flex-grow-1 gap-2">
                <!-- Repository Video Selector -->
                <select id="videoSelector"
                    class="form-select form-select-sm border-secondary bg-dark text-light w-auto">
                    <option value="">-- Load from list --</option>
                </select>
                <!-- Local File Input -->
                <input class="form-control form-control-sm border-secondary bg-dark text-light" type="file"
                    id="fileInput" accept="audio/*,video/mp4,video/webm">
            </div>
        </div>
    </nav>

    <!-- Main Content Area (Visualizer or Video) -->
    <main id="mediaContainer" class="d-flex justify-content-center align-items-center bg-black position-relative w-100">
        <!-- Message for NO FILE -->
        <div id="noFileMsg" class="text-center text-secondary">
            <i class="bi bi-file-earmark-music display-1"></i>
            <p class="mt-3">Tap "Choose File" or select from list to load Media</p>
        </div>

        <!-- Audio Visualizer -->
        <div id="audioVisualizer" class="text-center text-primary d-none">
            <i class="bi bi-soundwave display-1" id="musicIcon"></i>
        </div>

        <!-- Video Player -->
        <video id="videoPlayer" class="w-100 h-100 d-none" playsinline disablepictureinpicture
            controlslist="nodownload noplaybackrate"></video>

        <!-- Fullscreen Toggle Button (overlay) -->
        <button id="btnFullscreenToggle" class="btn btn-outline-light position-absolute d-none"
            style="top: 10px; right: 10px; z-index: 20; border: none; background: rgba(0,0,0,0.5); font-size: 1.2rem;">
            <i class="bi bi-arrows-fullscreen"></i>
        </button>

        <!-- Overlay: Loop Info (A-B) -->
        <div id="loopOverlay" class="position-absolute px-3 py-1 bg-dark bg-opacity-75 rounded-pill d-none"
            style="top: 10px; left: 10px; z-index: 10; font-size: 0.85rem; border: 1px solid #0dcaf0;">
            <i class="bi bi-arrow-repeat text-info me-1"></i>
            <span id="loopA" class="fw-bold">--:--</span> - <span id="loopB" class="fw-bold">--:--</span>
        </div>
    </main>

    <!-- Controls Area (Fixed Bottom for Mobile) -->
    <footer id="controlsArea" class="bg-black border-top border-secondary fixed-bottom px-1 py-1 overflow-y-auto"
        style="max-height: 45vh;">

        <!-- Seek Slider -->
        <div class="px-2 mt-1 mb-1">
            <input type="range" class="form-range" id="seekSlider" value="0" min="0" max="100" step="0.1" disabled style="height: 0.5rem;" title="Seek">
        </div>

        <!-- 1. Primary Transport Controls (Play, Stop, Skips, & Time) -->
        <div class="d-flex justify-content-between align-items-center mb-2 px-2">
            <div class="text-secondary" style="font-size: 0.75rem; font-family: monospace;">
                <span id="timeCurrent">00:00.0</span> / <span id="timeTotal">00:00.0</span>
            </div>
            <div class="d-flex justify-content-center align-items-center gap-2">
                <button
                    class="btn btn-outline-light rounded-circle d-flex justify-content-center align-items-center control-btn-sm"
                    id="btnSkipBack">
                    <i class="bi bi-rewind-fill"></i>
                </button>
                <button
                    class="btn btn-primary rounded-circle shadow-lg d-flex justify-content-center align-items-center play-btn-sm"
                    id="btnPlayPause" disabled>
                    <i class="bi bi-play-fill" id="iconPlay"></i>
                </button>
                <button
                    class="btn btn-outline-light rounded-circle d-flex justify-content-center align-items-center control-btn-sm"
                    id="btnSkipFwd">
                    <i class="bi bi-fast-forward-fill"></i>
                </button>
            </div>
        </div>

        <!-- 2. A-B Loop Controls -->
        <div class="card bg-dark border-secondary mb-2">
            <div class="card-body p-1 px-2 d-flex flex-wrap gap-2 justify-content-between align-items-center">
                <button class="btn btn-sm btn-outline-secondary d-flex justify-content-center align-items-center"
                    id="btnLoopMode" title="Loop Mode" style="width: 38px;">
                    <i class="bi bi-repeat" id="iconLoopMode"></i>
                </button>
                <div class="btn-group flex-grow-1" role="group">
                    <button class="btn btn-sm btn-outline-info" id="btnSetA">Set A</button>
                    <button class="btn btn-sm btn-outline-info" id="btnSetB">Set B</button>
                </div>
                <button class="btn btn-sm btn-outline-danger px-3 border-0" id="btnClearLoop" disabled><i
                        class="bi bi-x-lg"></i></button>
            </div>
        </div>

        <!-- 3. Tempo and Pitch (Side by side) -->
        <div class="row g-2 mb-2">
            <!-- Tempo Column -->
            <div class="col-6">
                <div class="card bg-dark border-secondary h-100">
                    <div class="card-body p-1 text-center">
                        <div class="text-secondary small mb-1"><i class="bi bi-speedometer2 me-1"></i>Tempo</div>
                        <div class="d-flex justify-content-between align-items-center gap-1">
                            <button class="btn btn-sm btn-secondary p-1" id="btnTempoDown"
                                style="width: 32px;">-</button>
                            <span class="text-light fw-bold flex-grow-1" id="valTempo"
                                style="font-family: monospace; font-size: 0.9rem;">100%</span>
                            <button class="btn btn-sm btn-secondary p-1" id="btnTempoUp" style="width: 32px;">+</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Pitch Column -->
            <div class="col-6">
                <div class="card bg-dark border-secondary h-100">
                    <div class="card-body p-1 text-center">
                        <div class="text-secondary small mb-1"><i class="bi bi-music-note me-1"></i>Pitch</div>
                        <div class="d-flex justify-content-between align-items-center gap-1">
                            <button class="btn btn-sm btn-secondary p-1" id="btnPitchDown"
                                style="width: 32px;">♭</button>
                            <span class="text-light fw-bold flex-grow-1" id="valPitch"
                                style="font-family: monospace; font-size: 0.9rem;">0 st</span>
                            <button class="btn btn-sm btn-secondary p-1" id="btnPitchUp" style="width: 32px;">#</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 4. Sync Slider -->
        <div class="card bg-dark border-secondary">
            <div class="card-body p-1 px-2">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label mb-0 text-secondary" style="font-size: 0.75rem;"><i
                            class="bi bi-clock-history me-1"></i>A/V Sync Offset</label>
                    <div class="d-flex align-items-center gap-2">
                        <span class="text-light fw-bold" id="valSync"
                            style="font-family: monospace; font-size: 0.8rem;">0.00s</span>
                        <button class="btn btn-sm btn-outline-secondary py-0 px-2" style="font-size: 0.7rem;"
                            id="btnResetSync">Reset</button>
                    </div>
                </div>
                <div class="d-flex align-items-center gap-1">
                    <button class="btn btn-outline-secondary btn-sm py-0 px-2 border-0" id="btnSyncMinus"><i
                            class="bi bi-dash"></i></button>
                    <input type="range" class="form-range flex-grow-1" id="sliderSync" min="-1.0" max="1.0" step="0.01"
                        value="0.0">
                    <button class="btn btn-outline-secondary btn-sm py-0 px-2 border-0" id="btnSyncPlus"><i
                            class="bi bi-plus"></i></button>
                </div>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <!-- Bootstrap JS (Optional, but good for tooltips, etc.) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SoundTouch JS (Pitch/Tempo algorithm) -->
    <script src="js/soundtouch.js"></script>
    <!-- Main App Logic -->
    <script src="js/app.js"></script>
</body>

</html>
