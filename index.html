<!DOCTYPE html>
<html lang="ja" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web Audio/Video Player</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-dark text-light">

    <!-- Navbar / Header -->
    <nav class="navbar navbar-dark bg-black border-bottom border-secondary fixed-top">
        <div class="container-fluid d-flex flex-wrap align-items-center gap-2">
            <span class="navbar-brand mb-0 h1 text-truncate" style="font-size: 1.1rem;">
                <i class="bi bi-music-note-beamed text-primary me-2"></i>ギターの練習するやつ
            </span>
            <div class="d-flex align-items-center flex-grow-1 gap-2">
                <!-- Repository Video Selector -->
                <select id="videoSelector"
                    class="form-select form-select-sm border-secondary bg-dark text-light w-auto">
                    <option value="">-- Load from list --</option>
                </select>
                <!-- Local File Input -->
                <input class="form-control form-control-sm border-secondary bg-dark text-light" type="file"
                    id="fileInput" accept="audio/*,video/mp4,video/webm">
            </div>
        </div>
    </nav>

    <!-- Main Content Area (Visualizer or Video) -->
    <main id="mediaContainer" class="d-flex justify-content-center align-items-center bg-black position-relative w-100">
        <!-- Message for NO FILE -->
        <div id="noFileMsg" class="text-center text-secondary">
            <i class="bi bi-file-earmark-music display-1"></i>
            <p class="mt-3">Tap "Choose File" or select from list to load Media</p>
        </div>

        <!-- Audio Visualizer -->
        <div id="audioVisualizer" class="text-center text-primary d-none">
            <i class="bi bi-soundwave display-1" id="musicIcon"></i>
        </div>

        <!-- Video Player -->
        <video id="videoPlayer" class="w-100 h-100 d-none" playsinline disablepictureinpicture
            controlslist="nodownload noplaybackrate"></video>

        <!-- Fullscreen Toggle Button (overlay) -->
        <button id="btnFullscreenToggle" class="btn btn-outline-light position-absolute d-none"
            style="top: 10px; right: 10px; z-index: 20; border: none; background: rgba(0,0,0,0.5); font-size: 1.2rem;">
            <i class="bi bi-arrows-fullscreen"></i>
        </button>

        <!-- Overlay: Loop Info (A-B) -->
        <div id="loopOverlay" class="position-absolute px-3 py-1 bg-dark bg-opacity-75 rounded-pill d-none"
            style="top: 10px; left: 10px; z-index: 10; font-size: 0.85rem; border: 1px solid #0dcaf0;">
            <i class="bi bi-arrow-repeat text-info me-1"></i>
            <span id="loopA" class="fw-bold">--:--</span> - <span id="loopB" class="fw-bold">--:--</span>
        </div>
    </main>

    <!-- Controls Area (Fixed Bottom for Mobile) -->
    <footer id="controlsArea" class="bg-black border-top border-secondary fixed-bottom px-2 py-3 overflow-y-auto"
        style="max-height: 55vh;">
        <!-- Timeline and Seek -->
        <div class="row g-0 align-items-center mb-3">
            <div class="col-12 text-center text-secondary mb-1" style="font-size: 0.8rem; font-family: monospace;">
                <span id="timeCurrent">00:00.0</span> / <span id="timeTotal">00:00.0</span>
            </div>
            <div class="col-12 px-2">
                <input type="range" class="form-range" id="seekSlider" value="0" min="0" max="100" step="0.1" disabled>
            </div>
        </div>

        <!-- Primary Transport Controls (Play, Stop, Skips) -->
        <div class="d-flex justify-content-center align-items-center gap-3 mb-4">
            <!-- Loop Toggle -->
            <button
                class="btn btn-outline-secondary rounded-circle d-flex justify-content-center align-items-center control-btn-sm"
                id="btnLoopMode" title="Loop Mode">
                <i class="bi bi-repeat" id="iconLoopMode"></i>
            </button>

            <button
                class="btn btn-outline-light rounded-circle d-flex justify-content-center align-items-center control-btn"
                id="btnSkipBack">
                <i class="bi bi-rewind-fill"></i>
            </button>
            <button
                class="btn btn-primary rounded-circle shadow-lg d-flex justify-content-center align-items-center play-btn"
                id="btnPlayPause" disabled>
                <i class="bi bi-play-fill" id="iconPlay"></i>
            </button>
            <button
                class="btn btn-outline-light rounded-circle d-flex justify-content-center align-items-center control-btn"
                id="btnSkipFwd">
                <i class="bi bi-fast-forward-fill"></i>
            </button>
        </div>

        <!-- Sliders: Tempo, Pitch, Sync -->
        <div class="card bg-dark border-secondary mb-3">
            <div class="card-body p-2">
                <!-- Tempo Slider -->
                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-baseline mb-1">
                        <label class="form-label mb-0 small text-secondary"><i
                                class="bi bi-speedometer2 me-1"></i>Tempo</label>
                        <div class="d-flex align-items-center gap-2">
                            <span class="text-light fw-bold" id="valTempo" style="font-family: monospace;">100%</span>
                            <button class="btn btn-sm btn-outline-secondary py-0 px-2 small"
                                id="btnResetTempo">Reset</button>
                        </div>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <span class="small text-secondary">50%</span>
                        <input type="range" class="form-range flex-grow-1" id="sliderTempo" min="0.5" max="1.2"
                            step="0.01" value="1.0">
                        <span class="small text-secondary">120%</span>
                    </div>
                </div>

                <!-- Pitch Slider -->
                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-baseline mb-1">
                        <label class="form-label mb-0 small text-secondary"><i
                                class="bi bi-music-note me-1"></i>Pitch</label>
                        <div class="d-flex align-items-center gap-2">
                            <span class="text-light fw-bold" id="valPitch" style="font-family: monospace;">0 st</span>
                            <button class="btn btn-sm btn-outline-secondary py-0 px-2 small"
                                id="btnResetPitch">Reset</button>
                        </div>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <span class="small text-secondary">-4</span>
                        <input type="range" class="form-range flex-grow-1" id="sliderPitch" min="-4" max="4" step="1"
                            value="0">
                        <span class="small text-secondary">+4</span>
                    </div>
                </div>

                <!-- Sync Slider -->
                <div class="mb-1" id="syncControlContainer">
                    <div class="d-flex justify-content-between align-items-baseline mb-1">
                        <label class="form-label mb-0 small text-secondary"><i
                                class="bi bi-clock-history me-1"></i>Video Sync Offset</label>
                        <div class="d-flex align-items-center gap-2">
                            <span class="text-light fw-bold" id="valSync" style="font-family: monospace;">0.00s</span>
                            <button class="btn btn-sm btn-outline-secondary py-0 px-2 small"
                                id="btnResetSync">Reset</button>
                        </div>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <button class="btn btn-outline-secondary btn-sm py-0 px-1" id="btnSyncMinus"><i
                                class="bi bi-dash"></i></button>
                        <input type="range" class="form-range flex-grow-1" id="sliderSync" min="-1.0" max="1.0"
                            step="0.01" value="0.0">
                        <button class="btn btn-outline-secondary btn-sm py-0 px-1" id="btnSyncPlus"><i
                                class="bi bi-plus"></i></button>
                    </div>
                    <small class="text-muted" style="font-size: 0.65rem;">If video lags behind audio, increase offset
                        (+).</small>
                </div>
            </div>
        </div>

        <!-- A-B Loop Controls -->
        <div class="card bg-dark border-secondary">
            <div class="card-body p-2 d-flex flex-wrap gap-2 justify-content-between align-items-center">
                <span class="small text-secondary"><i class="bi bi-arrow-repeat me-1"></i>A-B Loop</span>
                <div class="btn-group flex-grow-1" role="group">
                    <button class="btn btn-sm btn-outline-info" id="btnSetA">Set A</button>
                    <button class="btn btn-sm btn-outline-info" id="btnSetB">Set B</button>
                </div>
                <button class="btn btn-sm btn-outline-danger px-3" id="btnClearLoop" disabled><i
                        class="bi bi-x-lg"></i></button>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <!-- Bootstrap JS (Optional, but good for tooltips, etc.) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SoundTouch JS (Pitch/Tempo algorithm) -->
    <script src="js/soundtouch.js"></script>
    <!-- Main App Logic -->
    <script src="js/app.js"></script>
</body>

</html>
