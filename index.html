<!DOCTYPE html>
<html lang="ja" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Audio Player</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container-fluid d-flex flex-column vh-100 p-0">
        <!-- Header -->
        <header class="p-3 bg-dark border-bottom border-secondary d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <h1 class="h5 m-0 text-light"><i class="bi bi-music-note-beamed me-2"></i>Web Audio Player</h1>
                <a href="https://savefrom.net/" target="_blank" class="small text-secondary text-decoration-none hover-text-light">
                    <i class="bi bi-box-arrow-up-right me-1"></i>youtubeのダウンロードはここ
                </a>
            </div>
            <div class="d-flex gap-2">
                <input type="file" id="fileInput" class="form-control form-control-sm bg-dark text-light border-secondary" accept="audio/*,video/*">
            </div>
        </header>

        <!-- Main Content (Visualizer/Video) -->
        <main class="flex-grow-1 d-flex justify-content-center align-items-center bg-black position-relative overflow-hidden" id="visualizerContainer">
            <video id="videoPlayer" class="d-none w-100 h-100" style="object-fit: contain;" playsinline></video>
            <div id="audioVisualizer" class="text-center text-secondary">
                <i class="bi bi-music-note-list" style="font-size: 5rem;"></i>
                <p class="mt-3">Select a file to play</p>
            </div>
            
            <!-- Fullscreen Button (Video only) -->
            <button id="btnFullscreen" class="btn btn-sm btn-outline-light position-absolute top-0 end-0 m-3 d-none">
                <i class="bi bi-arrows-fullscreen"></i>
            </button>
        </main>

        <!-- Controls -->
        <footer class="bg-dark border-top border-secondary p-3">
            <!-- Seek Bar -->
            <div class="row mb-3">
                <div class="col-12">
                    <input type="range" class="form-range" id="seekBar" value="0" min="0" max="100" step="0.1">
                    <div class="d-flex justify-content-between text-secondary small">
                        <span id="currentTime">0:00</span>
                        <span id="totalTime">0:00</span>
                    </div>
                </div>
            </div>

            <!-- Main Buttons -->
            <div class="row mb-4 align-items-center justify-content-center">
                <div class="col-auto d-flex gap-3 align-items-center">
                    <button class="btn btn-outline-secondary rounded-circle" id="btnLoopToggle" title="Loop Mode">
                        <i class="bi bi-repeat"></i>
                    </button>
                    <button class="btn btn-outline-light rounded-circle" id="btnSkipBack">
                        <i class="bi bi-arrow-counterclockwise"></i> 5s
                    </button>
                    <button class="btn btn-play-lg rounded-circle text-white shadow" id="btnPlayPause">
                        <i class="bi bi-play-fill" style="font-size: 2rem;"></i>
                    </button>
                    <button class="btn btn-outline-light rounded-circle" id="btnStop">
                        <i class="bi bi-stop-fill"></i>
                    </button>
                    <button class="btn btn-outline-light rounded-circle" id="btnSkipFwd">
                        5s <i class="bi bi-arrow-clockwise"></i>
                    </button>
                </div>
            </div>

            <!-- Parameters & Loop Settings -->
            <div class="row g-3">
                <!-- Tempo -->
                <div class="col-md-4">
                    <div class="card bg-dark border-secondary h-100">
                        <div class="card-body p-2">
                            <label class="form-label small text-secondary d-flex justify-content-between">
                                Tempo <span id="valTempo" class="text-light">100%</span>
                            </label>
                            <input type="range" class="form-range" id="sliderTempo" min="0.5" max="2.0" step="0.01" value="1.0">
                            <div class="d-flex justify-content-between mt-1">
                                <button class="btn btn-xs btn-outline-secondary" id="btnTempoDown">-5%</button>
                                <button class="btn btn-xs btn-outline-secondary" id="btnTempoReset">Reset</button>
                                <button class="btn btn-xs btn-outline-secondary" id="btnTempoUp">+5%</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Pitch -->
                <div class="col-md-4">
                    <div class="card bg-dark border-secondary h-100">
                        <div class="card-body p-2">
                            <label class="form-label small text-secondary d-flex justify-content-between">
                                Pitch <span id="valPitch" class="text-light">0</span>
                            </label>
                            <input type="range" class="form-range" id="sliderPitch" min="-12" max="12" step="1" value="0">
                            <div class="d-flex justify-content-between mt-1">
                                <button class="btn btn-xs btn-outline-secondary" id="btnPitchDown">-1</button>
                                <button class="btn btn-xs btn-outline-secondary" id="btnPitchReset">Reset</button>
                                <button class="btn btn-xs btn-outline-secondary" id="btnPitchUp">+1</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Loop & Sync -->
                <div class="col-md-4">
                    <div class="card bg-dark border-secondary h-100">
                        <div class="card-body p-2 d-flex flex-column gap-2">
                            <!-- Loop Points -->
                            <div class="d-flex gap-1 justify-content-between">
                                <button class="btn btn-sm btn-outline-info flex-grow-1" id="btnSetA">Set A</button>
                                <button class="btn btn-sm btn-outline-info flex-grow-1" id="btnSetB">Set B</button>
                                <button class="btn btn-sm btn-outline-danger" id="btnClearLoop" title="Clear Loop"><i class="bi bi-x-lg"></i></button>
                            </div>
                            
                            <!-- A/V Sync -->
                            <div class="mt-auto">
                                <label class="form-label small text-secondary d-flex justify-content-between mb-0">
                                    A/V Sync <span id="valSync" class="text-light">0.00s</span>
                                </label>
                                <input type="range" class="form-range" id="sliderSync" min="-1.0" max="1.0" step="0.01" value="0">
                                <div class="d-flex justify-content-between mt-1">
                                    <button class="btn btn-xs btn-outline-secondary" id="btnSyncDown">-0.05s</button>
                                    <button class="btn btn-xs btn-outline-secondary" id="btnSyncReset">Reset</button>
                                    <button class="btn btn-xs btn-outline-secondary" id="btnSyncUp">+0.05s</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/soundtouch.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
