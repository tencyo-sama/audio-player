name: Secure Video Manager

on:
  issues:
    # opened（新規）に加えて edited（編集）もトリガーにする
    types: [opened, edited]

jobs:
  manage_video:
    if: github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Install yt-dlp
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Process Video
        run: |
          # フォルダがなければ作成
          mkdir -p videos
          
          TITLE="${{ github.event.issue.title }}"
          
          if [[ "$TITLE" == https* ]]; then
            echo "URL検知: ダウンロードを開始します"
            yt-dlp -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best" \
                   --merge-output-format mp4 \
                   -o "videos/%(title)s.%(ext)s" \
                   "$TITLE"
          elif [[ "$TITLE" == delete:* ]]; then
            FILENAME=$(echo "$TITLE" | sed 's/delete: //')
            echo "削除検知: $FILENAME を削除します"
            git rm "videos/$FILENAME" || echo "ファイルが見つかりません"
          fi

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # videosフォルダの中身をすべて追加（フォルダ自体もこれで認識される）
          git add videos/
          # 変更があればコミット
          git diff --staged --quiet || git commit -m "Update video collection"
          git push

      - name: Success Comment
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "処理が完了しました！ (実行時刻: $(date +'%H:%M:%S'))"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}