name: Secure Video Manager

on:
  issues:
    types: [opened]

jobs:
  manage_video:
    # 【重要】実行者が「自分（リポジトリオーナー）」の時だけ動く設定
    if: github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      # --- 削除処理 (Issueタイトルが "delete: " で始まる場合) ---
      - name: Delete Video
        if: startsWith(github.event.issue.title, 'delete:')
        run: |
          FILENAME=$(echo "${{ github.event.issue.title }}" | sed 's/delete: //')
          git rm "videos/$FILENAME" || echo "File not found"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove video: $FILENAME"
          git push
          echo "DELETED=true" >> $GITHUB_ENV

      # --- ダウンロード処理 (Issueタイトルが URL の場合) ---
      - name: Download Video
        if: contains(github.event.issue.title, 'https')
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          mkdir -p videos
          # ファイル名を短く管理しやすくするため title のみ指定
          yt-dlp -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best" \
                 --merge-output-format mp4 \
                 -o "videos/%(title)s.%(ext)s" \
                 "${{ github.event.issue.title }}"
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add videos/
          git commit -m "Add new practice video"
          git push

      - name: Close Issue
        run: gh issue close ${{ github.event.issue.number }} --comment "処理が完了しました。"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}